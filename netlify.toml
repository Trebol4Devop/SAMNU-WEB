[build]
  base = "website"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/web/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[redirects]]
  from = "/web"
  to = "/web/index.html"
  status = 200

[[redirects]]
  from = "/web/"
  to = "/web/index.html"
  status = 200

[[redirects]]
  from = "/web/*"
  to = "/web/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
